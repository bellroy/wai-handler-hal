name: Renovate
on:
  schedule:
    - cron: 02 */1 * * sun
  issues:
    types:
      - edited
      - reopened
  push:
    branches:
      - master
    paths:
      - .github/renovate.json
      - renovate.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  renovate:
    name: Renovate
    if: ${{ github.actor != 'bellroy-renovate-bot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }},bellroy-nix-foss

      - name: Run Renovate
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          token: ${{ steps.token.outputs.token }}
          docker-network: host
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_DEPENDENCY_DASHBOARD: true
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || 'info' }}
